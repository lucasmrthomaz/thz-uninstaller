[package]
name = "thz-uninstaller"
version = "1.5.4"
edition = "2021"
description = "Open-source desktop program uninstaller and leftover trace cleaner"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
winreg = "0.55.0"
flate2 = "1.1.10"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.45"
rfd = "0.15.4"
open = "5.4.5"
